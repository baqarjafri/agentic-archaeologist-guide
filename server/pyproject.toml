[project]
name = "agentic-archaeologist-server"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "openai>=1.50",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "pillow>=11.0",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs the ONNX model file or the network"]
